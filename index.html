<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한라대학교 - 날씨 &amp; 명언</title>
  <!-- Favicon: Halla University Emblem -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 120'%3E%3Cpath d='M50 4 L90 18 C90 70 50 112 50 112 C50 112 10 70 10 18 Z' fill='%23002b66' stroke='%2338bdf8' stroke-width='4'/%3E%3Ctext x='50' y='64' font-family='sans-serif' font-weight='900' font-size='38' fill='%2338bdf8' text-anchor='middle'%3E30%3C/text%3E%3Ctext x='50' y='82' font-family='sans-serif' font-weight='700' font-size='11' fill='%2393c5fd' text-anchor='middle'%3EYEARS%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <div class="nav-left">
      <!-- Optional Google Search Toggle Button -->
      <button id="search-toggle-btn" class="nav-icon-btn" title="구글 검색창 열기/닫기 (단축키: /)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span class="btn-text">Google 검색</span>
      </button>
    </div>
    <div class="nav-right">
      <!-- Dark mode toggle -->
      <button id="theme-toggle" class="nav-icon-btn" title="다크/라이트 모드 전환" aria-label="테마 전환">
        <svg class="theme-icon sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/>
        </svg>
        <svg class="theme-icon moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
        </svg>
      </button>

      <!-- Globe link to Halla Homepage -->
      <a href="https://www.halla.ac.kr" target="_blank" rel="noopener noreferrer" class="nav-icon-btn globe-btn" title="원주 한라대학교 공식 홈페이지 바로가기">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
      </a>
    </div>
  </header>

  <!-- Collapsible Google Search Bar -->
  <div id="search-container" class="search-container hidden">
    <form id="google-search-form" action="https://www.google.com/search" method="GET" class="search-form">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18">
          <path fill="#9AA0A6" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
        </svg>
        <input
          type="text"
          id="search-input"
          name="q"
          placeholder="Google 검색 또는 웹 주소 입력"
          autocomplete="off"
        />
        <button type="submit" class="search-submit-btn">검색</button>
      </div>
    </form>
  </div>

  <!-- Main Container -->
  <main class="page-container">
    <!-- Halla University Logo Pill Card (Center Top) -->
    <div class="brand-section">
      <a href="https://www.halla.ac.kr" target="_blank" rel="noopener noreferrer" class="halla-brand-card" title="원주 한라대학교 공식 홈페이지로 이동">
        <!-- 30 Years Shield Emblem -->
        <div class="emblem-container">
          <svg viewBox="0 0 100 120" width="36" height="43" class="halla-shield-svg">
            <defs>
              <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0b1b36"/>
                <stop offset="100%" stop-color="#002b66"/>
              </linearGradient>
              <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="100%" stop-color="#0ea5e9"/>
              </linearGradient>
            </defs>
            <!-- Shield Outline -->
            <path d="M50 4 L90 18 C90 72 50 114 50 114 C50 114 10 72 10 18 Z" fill="url(#shieldBg)" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
            <path d="M50 10 L84 22 C84 68 50 106 50 106 C50 106 16 68 16 22 Z" fill="none" stroke="#1e3a8a" stroke-width="1.5"/>
            <!-- 30 Years Text -->
            <text x="50" y="60" font-family="'Pretendard', sans-serif" font-weight="900" font-size="34" fill="url(#cyanText)" text-anchor="middle">30</text>
            <text x="50" y="77" font-family="'Pretendard', sans-serif" font-weight="700" font-size="10" fill="#93c5fd" text-anchor="middle" letter-spacing="1.5">YEARS</text>
            <path d="M28 85 Q50 91 72 85" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
          </svg>
        </div>

        <!-- Brand Text -->
        <div class="brand-text-wrap">
          <span class="brand-title">한라대학교</span>
          <span class="brand-subtitle">HALLA UNIVERSITY</span>
        </div>
      </a>
    </div>

    <!-- Weather Section -->
    <section class="weather-section">
      <div class="weather-header">
        <span class="weather-title">오늘의 날씨</span>
        <button id="refresh-weather-btn" class="refresh-icon-btn" title="날씨 새로고침" aria-label="날씨 새로고침">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>

      <div class="weather-grid">
        <!-- 원주 (Wonju) Card -->
        <div class="weather-card" id="card-wonju">
          <div class="card-header">
            <span class="city-name">원주</span>
            <span class="city-badge">Wonju</span>
          </div>
          <div class="card-body">
            <div class="weather-icon" id="wonju-icon">
              <!-- Default Sun Icon -->
              <svg viewBox="0 0 64 64" width="42" height="42"><circle cx="32" cy="32" r="14" fill="#f59e0b"/><g stroke="#f59e0b" stroke-width="4" stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="58"/><line x1="6" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="58" y2="32"/><line x1="13.6" y1="13.6" x2="17.8" y2="17.8"/><line x1="46.2" y1="46.2" x2="50.4" y2="50.4"/><line x1="13.6" y1="50.4" x2="17.8" y2="46.2"/><line x1="46.2" y1="17.8" x2="50.4" y2="13.6"/></g></svg>
            </div>
            <div class="temp-group">
              <span class="temp-value" id="wonju-temp">0°C</span>
              <span class="weather-status" id="wonju-desc">맑음</span>
            </div>
          </div>
          <div class="card-footer">
            <span class="meta-item" id="wonju-humidity">습도: 57%</span>
            <span class="meta-item" id="wonju-wind">풍속: 6.9 m/s</span>
          </div>
        </div>

        <!-- 서울 (Seoul) Card -->
        <div class="weather-card" id="card-seoul">
          <div class="card-header">
            <span class="city-name">서울</span>
            <span class="city-badge">Seoul</span>
          </div>
          <div class="card-body">
            <div class="weather-icon" id="seoul-icon">
              <svg viewBox="0 0 64 64" width="42" height="42"><circle cx="32" cy="32" r="14" fill="#f59e0b"/><g stroke="#f59e0b" stroke-width="4" stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="58"/><line x1="6" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="58" y2="32"/><line x1="13.6" y1="13.6" x2="17.8" y2="17.8"/><line x1="46.2" y1="46.2" x2="50.4" y2="50.4"/><line x1="13.6" y1="50.4" x2="17.8" y2="46.2"/><line x1="46.2" y1="17.8" x2="50.4" y2="13.6"/></g></svg>
            </div>
            <div class="temp-group">
              <span class="temp-value" id="seoul-temp">1°C</span>
              <span class="weather-status" id="seoul-desc">맑음</span>
            </div>
          </div>
          <div class="card-footer">
            <span class="meta-item" id="seoul-humidity">습도: 48%</span>
            <span class="meta-item" id="seoul-wind">풍속: 3.9 m/s</span>
          </div>
        </div>

        <!-- 제주 (Jeju) Card -->
        <div class="weather-card" id="card-jeju">
          <div class="card-header">
            <span class="city-name">제주</span>
            <span class="city-badge">Jeju</span>
          </div>
          <div class="card-body">
            <div class="weather-icon" id="jeju-icon">
              <svg viewBox="0 0 64 64" width="42" height="42"><circle cx="26" cy="24" r="11" fill="#f59e0b"/><path d="M22 46 h26 a12 12 0 0 0 0-24 a13 13 0 0 0-24 4 a10 10 0 0 0-2 20 z" fill="#93c5fd" opacity="0.95"/></svg>
            </div>
            <div class="temp-group">
              <span class="temp-value" id="jeju-temp">10°C</span>
              <span class="weather-status" id="jeju-desc">구름 조금</span>
            </div>
          </div>
          <div class="card-footer">
            <span class="meta-item" id="jeju-humidity">습도: 83%</span>
            <span class="meta-item" id="jeju-wind">풍속: 12.2 m/s</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Quote Section -->
    <section class="quote-section">
      <div class="quote-card">
        <div class="quote-badge-wrap">
          <span class="quote-badge">오늘의 명언</span>
        </div>
        <div class="quote-content-wrap">
          <p id="quote-text" class="quote-text">“우리가 두려워해야 할 유일한 것은 두려움 그 자체다”</p>
          <p id="quote-author" class="quote-author">— 프랭클린 D. 루스벨트</p>
        </div>
        <div class="quote-btn-wrap">
          <button id="new-quote-btn" class="other-quote-btn" title="다른 명언 보기">
            <span class="sparkle-icon">✦</span> 다른 명언
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
